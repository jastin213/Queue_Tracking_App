name: queue_tracking_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.5
  image_picker: ^1.1.2
  image: ^4.8.0
  file_picker: ^8.0.7
  http: ^1.2.2
  pdf: ^3.11.3
  printing: ^5.14.2

  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path_android: "assets/branding/vehicle_queue_logo_v2.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F1FAFC"
  adaptive_icon_foreground: "assets/branding/vehicle_queue_logo_v2.png"
  adaptive_icon_foreground_inset: 20

flutter:
  uses-material-design: true
